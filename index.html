<style>
/* Layout : app mobile à barre d'onglets flottante (verre dépoli), colonne latérale sur grand écran.
   Direction : monochrome net façon appli de mode, cartes sans bordure à ombre douce, un seul accent indigo électrique, mots-clés en serif italique. */
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --sunk:#ECECE8; --ink:#0B0B0F; --muted:#6B6B73; --line:#E4E4E0;
  --accent:#4F46E5; --accent-ink:#FFFFFF; --accent-soft:#EEEDFD; --tag:#0B0B0F; --tag-ink:#FFFFFF;
  --swatch:#F1F1EE; --good:#15803D; --warn:#B45309; --bad:#DC2626;
  --glass:rgba(255,255,255,.72); --shadow:0 1px 2px rgba(16,16,24,.04),0 8px 24px -12px rgba(16,16,24,.12);
  --shadow-lg:0 24px 60px -20px rgba(16,16,24,.35);
  --f-display:"Geist", "SF Pro Display", system-ui, sans-serif;
  --f-body:"Geist", "SF Pro Text", system-ui, sans-serif;
  --f-mono:"Geist Mono", ui-monospace, Menlo, monospace;
  --f-serif:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --r:22px; --r-sm:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09090B; --surface:#141417; --sunk:#1C1C21; --ink:#F4F4F5; --muted:#9A9AA3; --line:#26262C;
  --accent:#8B85FF; --accent-ink:#0B0B0F; --accent-soft:#211F3D; --tag:#F4F4F5; --tag-ink:#0B0B0F;
  --swatch:#EDEDEA; --good:#4ADE80; --warn:#FBBF24; --bad:#F87171;
  --glass:rgba(20,20,23,.72); --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090B; --surface:#141417; --sunk:#1C1C21; --ink:#F4F4F5; --muted:#9A9AA3; --line:#26262C;
  --accent:#8B85FF; --accent-ink:#0B0B0F; --accent-soft:#211F3D; --tag:#F4F4F5; --tag-ink:#0B0B0F;
  --swatch:#EDEDEA; --good:#4ADE80; --warn:#FBBF24; --bad:#F87171;
  --glass:rgba(20,20,23,.72); --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.035em;font-weight:700}
em.s,.s{font-family:var(--f-serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
.mono{font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted)}
.muted{color:var(--muted)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
main{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:20px 130px;max-width:1120px;width:100%;margin:0 auto;min-width:0}
.tabs{position:fixed;z-index:20;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  margin:0 auto;max-width:460px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;border-radius:999px;
  background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border-radius:999px;color:var(--muted);font-size:10.5px;font-weight:600;transition:background .2s,color .2s}
.tab svg{width:21px;height:21px}
.tab[aria-current="page"]{color:var(--bg);background:var(--ink)}
@media (min-width:900px){
  .app{grid-template-columns:248px 1fr}
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:28px 16px}
  .side .tab{flex-direction:row;gap:12px;font-size:14px;padding:11px 14px;justify-content:flex-start;font-weight:500}
  .brand{margin:0 10px 26px}
  main{padding-block:36px 56px}
}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.04em}
.brand svg{width:26px;height:26px;color:var(--ink)}
.brand i{font-family:var(--f-serif);font-weight:400;color:var(--accent);font-size:1.15em;margin-left:-2px}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-size:clamp(34px,8vw,52px);font-weight:700;line-height:.98;letter-spacing:-.045em}
.head h1 .s{color:var(--accent);font-size:1.08em}
.head p{margin:8px 0 0;color:var(--muted);font-size:15px}
.mobile-brand{display:flex;align-items:center;gap:8px;margin-bottom:18px}
@media (min-width:900px){.mobile-brand{display:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;border:0;background:var(--sunk);padding:10px 18px;font-weight:600;font-size:14px;white-space:nowrap;transition:transform .15s,background .2s,filter .2s}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{filter:none;opacity:.88}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn svg{width:17px;height:17px}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.banner{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:18px;font-size:13px;color:var(--ink)}
.banner span{flex:1;min-width:0}
.banner .btn{background:var(--surface)}

.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip .muted{opacity:.7}
.chip[aria-pressed="true"] .muted{color:inherit}
.dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1px var(--line);flex:none}
select.chip{appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat;background-color:var(--surface)}
input.chip{outline-offset:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.piece{position:relative;background:var(--surface);border:0;border-radius:var(--r);padding:6px 6px 12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:var(--shadow);transition:transform .2s}
.piece:hover{transform:translateY(-2px)}
.piece .name,.piece .meta{padding:0 8px}
.thumb{aspect-ratio:4/5;max-width:100%;background:var(--swatch);border-radius:var(--r-sm);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.thumb svg{width:74%;height:74%}
.piece .name{font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.015em}
.piece .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.piece .meta .mono{font-family:var(--f-mono);font-size:11px}
.swatches{display:flex;gap:3px}
.swatches .dot{width:10px;height:10px}
.label{position:absolute;top:14px;left:14px;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--ink);font:600 10.5px/1 var(--f-body);padding:5px 8px;border-radius:999px}

.outfits{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.outfit{background:var(--surface);border-radius:var(--r);padding:8px 8px 14px;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0;box-shadow:var(--shadow)}
.outfit>.row,.outfit>.tags,.outfit>.btn{margin:0 8px}
.collage{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;border-radius:var(--r-sm);overflow:hidden}
.collage .thumb{border-radius:4px;aspect-ratio:1}
.collage.n3 .thumb:first-child{grid-row:span 2;aspect-ratio:auto}
.outfit h3{font-size:18px;font-weight:650;letter-spacing:-.025em}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tagl{font-size:11.5px;font-weight:500;background:var(--sunk);border-radius:999px;padding:3px 9px;color:var(--muted)}
.fav{color:var(--accent)}

.panel{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:760px){.cols{grid-template-columns:1.3fr 1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}

.today{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:760px){.today{grid-template-columns:1.45fr 1fr}}
.hero-outfit{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.hero-outfit .piece{box-shadow:none;background:var(--sunk);padding:5px 5px 10px}
.hero-outfit .piece .thumb{background:var(--swatch)}
.scorebar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.scorebar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.why li{display:flex;gap:8px}
.why li::before{content:"";flex:none;width:6px;height:6px;margin-top:8px;border-radius:50%;background:var(--accent)}
.ai-box{background:var(--accent-soft);border-radius:var(--r-sm);padding:14px 16px;font-size:14px;white-space:pre-wrap;min-height:1.5em}
.wx-now{display:flex;align-items:center;gap:12px;background:var(--sunk);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px}
.wx-t{font:600 26px/1 var(--f-display);letter-spacing:-.03em}
.wx-d{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px;line-height:1.35}
.wx-d .muted{font-size:12.5px}
.wx-note{margin:0 0 10px;font-size:12px;color:var(--muted)}
.wx-note.err{color:var(--bad)}
.wx-set{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.wx-city{width:100%;text-align:left;background:none;border:0;padding:6px 0}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:inherit}
.weather{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.weather .chip{justify-content:center;flex-direction:column;border-radius:var(--r-sm);padding:10px 4px;gap:1px;box-shadow:none;background:var(--sunk)}
.weather .chip[aria-pressed="true"]{background:var(--ink)}
.weather .chip b{font-family:var(--f-mono);font-size:10.5px;font-weight:500;opacity:.7}
.chips .chip{box-shadow:none;background:var(--sunk)}
.chips .chip[aria-pressed="true"]{background:var(--ink)}

.missing{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.missing:first-child{border-top:0;padding-top:0}
.missing .thumb{width:60px;flex:none;aspect-ratio:1}
.big-n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.04em}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;font-weight:500;color:var(--muted);text-align:center;padding:4px 0}
.day{aspect-ratio:1/1.2;max-width:100%;border:0;background:var(--sunk);border-radius:12px;padding:4px;display:flex;flex-direction:column;align-items:stretch;gap:2px;font-size:11px;min-width:0;overflow:hidden}
.day.out{opacity:.35}
.day.is-today{background:var(--ink);color:var(--bg)}
.day .n{font-variant-numeric:tabular-nums;font-weight:600;text-align:left;padding-left:3px}
.day .thumb{flex:1;border-radius:8px;aspect-ratio:auto}
.day .thumb svg{width:70%;height:70%}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li:last-child{padding-bottom:0}
.li .thumb{width:72px;flex:none;aspect-ratio:1}
.li .body{flex:1;min-width:0}
.li .body b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}

.scrim{position:fixed;inset:0;background:rgba(9,9,11,.42);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
@media (min-width:700px){.scrim{align-items:center;padding:24px}}
.sheet{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;box-shadow:var(--shadow-lg);animation:up .28s cubic-bezier(.2,.8,.2,1);
  padding:26px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet::before{content:"";position:absolute;top:9px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:var(--line)}
@media (min-width:700px){.sheet{border-radius:28px;padding:28px}.sheet::before{display:none}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.sheet-head h2{font-size:24px;font-weight:700;letter-spacing:-.035em}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--sunk);display:grid;place-items:center;flex:none}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field>label,.field>.lab{font-size:13px;font-weight:600;color:var(--ink)}
.input{width:100%;border:1px solid transparent;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:12px 14px;transition:border-color .2s}
.input:focus{outline:none;border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.choice>button,.choice .pick{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;background:var(--surface);border:0;border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.choice>button:hover{box-shadow:0 0 0 2px var(--accent)}
.choice b{font-size:15px;font-weight:650;letter-spacing:-.02em}
.choice span{font-size:13px;color:var(--muted)}
.choice svg{width:22px;height:22px;color:var(--accent)}
.choice .pick .row{margin-top:6px}
.choice .pick label{cursor:pointer;position:relative}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;left:0;top:0}
label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.slot{margin-bottom:16px}
.slot .strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.slot .strip button{flex:none;width:86px;padding:4px;border:0;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.slot .strip button[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent)}
.slot .strip .thumb{border-radius:12px}
.empty{text-align:center;padding:40px 18px;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty svg.big{width:72px;height:72px;color:var(--muted)}
.empty h2{font-size:24px}
.empty p{max-width:44ch;margin:0;color:var(--muted)}
.spinner{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner,.scrim,.sheet{animation:none}.piece,.btn{transition:none}}
.toast{pointer-events:auto;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg);animation:fade .2s}
@media (min-width:900px){.toast{bottom:28px}}
.scan-row{display:flex;gap:12px;align-items:center;padding:8px;border-radius:var(--r-sm);background:var(--surface);box-shadow:var(--shadow)}
.scan-row .thumb{width:60px;flex:none;aspect-ratio:1}
.scan-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.confirm{background:var(--surface);box-shadow:0 0 0 1.5px var(--bad);border-radius:var(--r-sm);padding:14px;display:flex;flex-direction:column;gap:8px}
textarea.input{min-height:160px;resize:vertical}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:30px 0 12px}
.section-title h2{font-size:22px;font-weight:700;letter-spacing:-.035em}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 15px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat div{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-sm);padding:14px;box-shadow:var(--shadow);min-width:0}
.panel .stat div{background:var(--sunk);box-shadow:none}
.stat b{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-.04em}
.stat span{font-size:12px;color:var(--muted)}
.shops{display:flex;gap:6px;flex-wrap:wrap}
.res{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.res:first-child{border-top:0;padding-top:0}
.res .thumb{width:60px;flex:none;aspect-ratio:1}

/* ---------- Stockage : base Claude privée par personne, sinon navigateur ---------- */
const DB = { items:new Map(), outfits:new Map(), wear:new Map(), wish:new Map() };
const KIND_OF = { item:"items", outfit:"outfits", wear:"wear", wish:"wish" };
const store = { mode:"loading", col:null, ai:null, aiImages:false, loaded:false };
function ingest(docs){
  for(const m of Object.values(DB)) m.clear();
  for(const [id, d] of docs){ const k = KIND_OF[d.kind]; if(k) DB[k].set(id, {...d, id}); }
}
async function localLoad(){ return (await kvGet(cacheKey())) || {}; }
let storageWarned = false, saveTimer = null;
function localSave(){
  const k = cacheKey(); clearTimeout(saveTimer);
  saveTimer = setTimeout(() => localSaveNow(k), 120);
}
async function localSaveNow(k){
  const all = {}; for(const m of Object.values(DB)) for(const [id,d] of m) all[id]=d;
  if(!(await kvSet(k, all)) && !storageWarned){ storageWarned = true; toast(store.mode==="cloud" ? "Mémoire du navigateur pleine : tes données restent dans ton compte, mais l'accès hors ligne est limité." : "Stockage du navigateur plein : retire des photos ou crée un compte."); }
}
/* Enregistre / supprime un lot d'éléments, quel que soit le mode (base Claude, compte Supabase, appareil) */
async function saveMany(docs){
  const old = [];
  for(const d of docs){ const k = KIND_OF[d.kind]; if(!k) continue; const prev = DB[k].get(d.id); if(prev && (prev.photo||"").startsWith("sb:") && prev.photo !== d.photo) old.push(prev.photo.slice(3)); DB[k].set(d.id, d); }
  trashPhotos(old);
  render();
  if(store.mode==="db"){ for(const d of docs){ const {id, ...data} = d; try{ await store.col.doc(id).set(data); }catch(e){ toast("Enregistrement refusé : " + (e.code||"erreur")); break; } } }
  else { localSave(); if(store.mode==="cloud") queue(docs.map(d => ({op:"put", id:d.id}))); }
}
async function removeMany(ids){
  const old = [];
  for(const id of ids) for(const m of Object.values(DB)){ const d = m.get(id); if(d && (d.photo||"").startsWith("sb:")) old.push(d.photo.slice(3)); m.delete(id); }
  trashPhotos(old);
  render();
  if(store.mode==="db"){ for(const id of ids){ try{ await store.col.doc(id).delete(); }catch(e){ toast("Suppression refusée."); break; } } }
  else { localSave(); if(store.mode==="cloud") queue(ids.map(id => ({op:"del", id}))); }
}
async function put(doc){ await saveMany([doc]); }
async function del(kind, id){ await removeMany([id]); }
async function initStore(){
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
  if(STANDALONE){ if(getKey()){ store.ai = makeApiAI(); store.aiImages = true; store.web = true; } startStandalone(); return; }
  use("sample").then(async s => {
    store.ai = s;
    if(s){ const lim = await s.limits().catch(()=>null); store.aiImages = !!(lim && lim.images); }
    render();
  });
  const [db, user] = await Promise.all([use("db"), use("user")]);
  const id = user ? await user.id().catch(()=>null) : null;
  if(db && id){
    store.mode = "db";
    store.col = db.collection("data/users/" + id);
    const timer = setTimeout(()=>{ if(!store.loaded){ store.loaded = true; render(); toast("Chargement lent : réessaie dans un instant."); } }, 10000);
    store.col.onSnapshot(snap => {
      clearTimeout(timer); store.loaded = true;
      ingest(snap.docs.map(d => [d.id, d.data()]));
      render();
    }, err => { clearTimeout(timer); store.loaded = true; toast("Base indisponible (" + err.code + ")."); render(); });
  } else {
    store.mode = "local";
    ingest(Object.entries(await localLoad())); store.loaded = true;
    render();
  }
}

/* ---------- Dérivés ---------- */
const items = () => [...DB.items.values()].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
const byCat = c => items().filter(i=>i.category===c);
function wearStats(){
  const s = {}; // itemId -> {count, last}
  for(const w of DB.wear.values()) for(const iid of (w.itemIds||[])){
    const o = s[iid] || (s[iid]={count:0,last:null});
    o.count++; if(!o.last || w.date > o.last) o.last = w.date;
  }
  return s;
}
function outfitItems(o){ return (o.itemIds||[]).map(id=>DB.items.get(id)||DB.wish.get(id)).filter(Boolean); }
function colorScore(list){
  const acc = [...new Set(list.map(i=>(i.colors||[])[0]).filter(c=>c && !NEUTRAL.has(c)))];
  let s;
  if(acc.length===0) s = .86;
  else if(acc.length===1) s = 1;
  else if(acc.length===2) s = GOOD_PAIRS.some(([a,b])=>(acc[0]===a&&acc[1]===b)||(acc[0]===b&&acc[1]===a)) ? .9 : .45;
  else s = .2;
  const cols = list.map(i=>(i.colors||[])[0]);
  if(cols.includes("noir") && cols.includes("marine") && acc.length===0) s -= .12;
  if(cols.includes("noir") && cols.includes("marron")) s -= .08;
  return Math.max(0, Math.min(1, s));
}
function styleScore(list, occ){
  if(!occ) return .7;
  const want = OCCASIONS[occ].styles;
  const hits = list.filter(i => (i.styles||[]).some(s=>want.includes(s))).length;
  return hits / list.length;
}
/* Combinaisons de base : (haut + bas | robe) + chaussures */
function baseCombos(pool){
  const P = pool || items();
  const tops = P.filter(i=>i.category==="haut"), bots = P.filter(i=>i.category==="bas"),
        dresses = P.filter(i=>i.category==="robe"), shoes = P.filter(i=>i.category==="chaussures");
  const out = [];
  for(const s of shoes){
    for(const t of tops) for(const b of bots) out.push([t,b,s]);
    for(const d of dresses) out.push([d,s]);
  }
  return out;
}
/* Combien de bonnes combinaisons une pièce candidate ajouterait */
function addedValue(cand){
  const pool = items().filter(i=>!i.demoHidden);
  if(["haut","bas","robe","chaussures"].includes(cand.category)){
    const combos = baseCombos([...pool, {...cand, id:"__cand"}]).filter(c=>c.some(i=>i.id==="__cand"));
    return {n: combos.filter(c=>colorScore(c)>=.85).length, unit:"combinaisons"};
  }
  const outs = [...DB.outfits.values()].map(outfitItems).filter(l=>l.length);
  return {n: outs.filter(l=>!l.some(i=>i.category===cand.category) && colorScore([...l,cand])>=.85).length, unit:"de tes tenues"};
}

/* ---------- Moteur de suggestion (règles simples) ---------- */
function suggest({weather, occ, rain}){
  const ws = wearStats(); const t = today();
  const W = WEATHER[weather];
  const fits = i => {
    if(i.seasons && i.seasons.length && !i.seasons.some(s=>W.seasons.includes(s))) return false;
    if(rain && ["Sandales","Escarpins"].includes(i.type)) return false;
    if(weather==="chaud" && (i.warmth||1)>=3) return false;
    if(weather==="froid" && i.category!=="couche" && ["Short","Débardeur","Sandales"].includes(i.type)) return false;
    return true;
  };
  const pool = items().filter(fits);
  const fresh = i => { const l = ws[i.id]?.last; if(!l) return 1; const d = daysBetween(l,t); return d<=1?0:d<=3?.35:Math.min(1,d/7); };
  let combos = baseCombos(pool);
  if(combos.length>6000) combos = combos.sort(()=>Math.random()-.5).slice(0,6000);
  const scored = combos.map(c => {
    const col = colorScore(c), sty = styleScore(c, occ), fr = c.reduce((a,i)=>a+fresh(i),0)/c.length;
    return {pieces:c, col, sty, fr, score: col*.45 + sty*.35 + fr*.2 + Math.random()*.03};
  }).sort((a,b)=>b.score-a.score);
  const picks = [];
  for(const s of scored){ if(picks.length>=4) break; if(picks.some(p=>p.pieces[0].id===s.pieces[0].id || p.pieces[1].id===s.pieces[1].id)) continue; picks.push(s); }
  const layers = pool.filter(i=>i.category==="couche");
  for(const p of picks){
    if(weather!=="chaud" && layers.length){
      const best = layers.map(l=>({l, s:colorScore([...p.pieces,l]) + styleScore([l],occ)*.3 + fresh(l)*.1})).sort((a,b)=>b.s-a.s)[0];
      if(weather==="froid"||weather==="frais"||rain||best.s>1.1) p.pieces = [...p.pieces, best.l];
    }
    p.why = [];
    p.why.push(p.col>=.95 ? "Une seule couleur forte, le reste en neutres" : p.col>=.85 ? "Palette neutre, facile à porter" : "Association de couleurs plus audacieuse");
    if(occ) p.why.push(p.sty>=.99 ? `Toutes les pièces collent à l'occasion « ${OCCASIONS[occ].label} »` : `Style partiellement adapté à « ${OCCASIONS[occ].label} »`);
    p.why.push(p.fr>=.8 ? "Aucune pièce portée ces 3 derniers jours" : "Contient une pièce portée récemment");
    if(p.pieces.some(i=>i.category==="couche")) p.why.push(`Une couche ajoutée pour la météo « ${W.label.toLowerCase()} »`);
  }
  return picks;
}

/* ---------- Images ---------- */
function loadImage(src){ return new Promise((res,rej)=>{ const im = new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
async function fileToImage(file){ const url = URL.createObjectURL(file); try{ return await loadImage(url); } finally{ setTimeout(()=>URL.revokeObjectURL(url), 2000); } }
function drawTo(im, max, crop){
  const sx = crop ? crop[0]*im.naturalWidth : 0, sy = crop ? crop[1]*im.naturalHeight : 0;
  const sw = crop ? (crop[2]-crop[0])*im.naturalWidth : im.naturalWidth, sh = crop ? (crop[3]-crop[1])*im.naturalHeight : im.naturalHeight;
  const k = Math.min(1, max/Math.max(sw,sh));
  const c = document.createElement("canvas"); c.width = Math.max(1,Math.round(sw*k)); c.height = Math.max(1,Math.round(sh*k));
  const g = c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(im, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
const toDataURL = c => c.toDataURL("image/jpeg", .8);

function cleanTags(t){
  const o = {};
  o.category = CATS[t.category] ? t.category : "haut";
  o.type = CATS[o.category].types.includes(t.type) ? t.type : CATS[o.category].types[0];
  o.colors = (Array.isArray(t.colors)?t.colors:[]).filter(c=>COLORS[c]).slice(0,2);
  if(!o.colors.length) o.colors = ["gris"];
  o.seasons = (t.seasons||[]).filter(s=>SEASONS[s]);
  o.styles = (t.styles||[]).filter(s=>STYLES[s]);
  o.warmth = [1,2,3].includes(+t.warmth) ? +t.warmth : 1;
  o.name = String(t.name||CATS[o.category].one).slice(0,60);
  o.brand = t.brand ? String(t.brand).slice(0,40) : "";
  o.material = t.material ? String(t.material).slice(0,40) : "";
  return o;
}
function aiError(e){
  const c = e && e.code;
  if(c==="not_granted") return "Accès à Claude refusé pour cette page.";
  if(c==="rate_limited") return "Trop de demandes à Claude, réessaie dans une minute.";
  if(c==="invalid_json") return "Réponse de Claude illisible, réessaie.";
  if(c==="bad_key") return "Clé API refusée : vérifie-la dans les réglages.";
  if(c==="no_credit") return "Compte API sans crédit : recharge-le sur console.anthropic.com.";
  if(c==="network") return "Pas de connexion à l'API Claude.";
  if(c==="refusal") return "Claude a refusé cette demande.";
  return "Claude n'a pas pu répondre" + (c ? ` (${c})` : "") + ".";
}

const SDK_URL = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.135.0/+esm";
const MODEL = "claude-opus-5-5";
const EFFORT = {quick:"low", default:"medium", complex:"high"};
const FALLBACK = {betas:["server-side-fallback-2026-07-01"], fallbacks:"default"};
function getKey(){ try{ return localStorage.getItem("cintre.key") || ""; }catch{ return ""; } }
let clientPromise = null;
function getClient(){
  if(!clientPromise) clientPromise = import(SDK_URL).then(m => new m.default({apiKey:getKey(), dangerouslyAllowBrowser:true})).catch(e => { clientPromise = null; throw {code:"network"}; });
  return clientPromise;
}
function apiErr(e){
  if(e && e.code && !e.status) return e;
  const st = e && e.status;
  if(st===401 || st===403) return {code:"bad_key"};
  if(st===429) return {code:"rate_limited"};
  if(st===400 && /credit/i.test(e.message||"")) return {code:"no_credit"};
  if(!st) return {code:"network"};
  return {code:"http_"+st};
}
const blobToB64 = b => new Promise((res,rej)=>{ const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(b); });
function parseLooseJSON(text){
  try{ return JSON.parse(text); }catch{}
  const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/); if(fence){ try{ return JSON.parse(fence[1]); }catch{} }
  const a = text.search(/[\[{]/), b = Math.max(text.lastIndexOf("}"), text.lastIndexOf("]"));
  if(a>=0 && b>a){ try{ return JSON.parse(text.slice(a,b+1)); }catch{} }
  throw {code:"invalid_json", text};
}
function makeApiAI(){
  async function ask(input, opts={}){
    try{
      const client = await getClient();
      const content = [];
      for(const b of [].concat(opts.images || [])) content.push({type:"image", source:{type:"base64", media_type:b.type || "image/jpeg", data:await blobToB64(b)}});
      content.push({type:"text", text:input});
      const stream = client.beta.messages.stream({model:MODEL, max_tokens:16000, output_config:{effort:EFFORT[opts.modelTier] || "medium"}, ...FALLBACK, messages:[{role:"user", content}]});
      if(opts.onText) stream.on("text", (delta, snapshot) => opts.onText({text:snapshot, delta}));
      const msg = await stream.finalMessage();
      if(msg.stop_reason === "refusal") throw {code:"refusal"};
      return {text: msg.content.filter(c=>c.type==="text").map(c=>c.text).join(""), truncated: msg.stop_reason==="max_tokens"};
    }catch(e){ throw apiErr(e); }
  }
  ask.json = async (input, opts) => parseLooseJSON((await ask(input + "\n\nRéponds uniquement avec le JSON demandé, sans texte autour.", opts)).text);
  ask.limits = async () => ({images:{maxCount:5}});
  return ask;
}

async function liveShopSearch(q){
  const client = await getClient().catch(e=>{ throw apiErr(e); });
  const prompt = `Cherche sur le web des vêtements actuellement en vente en ligne en France qui correspondent à : « ${q} ». Vise des pages produit de boutiques en ligne réelles (marques, Zalando, ASOS, grands magasins, seconde main). Réponds uniquement avec du JSON : {"results": [{"name": string, "brand": string, "price": nombre ou null, "currency": "EUR", "shop": string, "url": "adresse exacte de la page trouvée dans les résultats de recherche", "category": un de ${JSON.stringify(Object.keys(CATS))}, "type": string, "colors": 1 ou 2 valeurs parmi ${JSON.stringify(Object.keys(COLORS))}}]}. 8 résultats au maximum. N'invente ni adresse ni prix : mets null quand l'information ne figure pas dans les résultats.`;
  const tools = [{type:"web_search_20260209", name:"web_search", max_uses:5, user_location:{type:"approximate", country:"FR"}}];
  let messages = [{role:"user", content:prompt}], msg;
  try{
    for(let k=0; k<4; k++){
      msg = await client.beta.messages.create({model:MODEL, max_tokens:16000, output_config:{effort:"medium"}, ...FALLBACK, tools, messages});
      if(msg.stop_reason !== "pause_turn") break;
      messages = [messages[0], {role:"assistant", content:msg.content}];
    }
  }catch(e){ throw apiErr(e); }
  if(msg.stop_reason === "refusal") throw {code:"refusal"};
  const seen = new Set();
  for(const b of msg.content) if(b.type==="web_search_tool_result" && Array.isArray(b.content)) for(const r of b.content){ try{ seen.add(new URL(r.url).hostname); }catch{} }
  const text = msg.content.filter(c=>c.type==="text").map(c=>c.text).join("");
  const data = parseLooseJSON(text);
  return (Array.isArray(data?.results) ? data.results : []).filter(r => {
    try{ const u = new URL(r.url); return /^https?:$/.test(u.protocol) && seen.has(u.hostname); }catch{ return false; }
  }).map(r => ({...cleanTags(r), name:String(r.name||"").slice(0,80), brand:String(r.brand||"").slice(0,40), price: typeof r.price==="number" ? r.price : null, shop:String(r.shop||"").slice(0,40), url:r.url}));
}

async function wxFetch(){
  if(!wx.loc || wx.busy) return;
  wx.busy = true; wx.err = ""; render();
  try{
    const {lat, lon} = wx.loc;
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max,precipitation_sum&timezone=auto&forecast_days=1`);
    if(!r.ok) throw 0;
    const j = await r.json(), d = j.daily;
    const pop = d.precipitation_probability_max?.[0] ?? 0, code = d.weather_code[0];
    wx.data = { at:Date.now(), day:today(), now:Math.round(j.current?.temperature_2m ?? d.temperature_2m_max[0]),
      min:Math.round(d.temperature_2m_min[0]), max:Math.round(d.temperature_2m_max[0]),
      /* ressenti de la journée : pondéré vers l'après-midi, là où on passe le plus de temps dehors */
      feel:Math.round((2*d.apparent_temperature_max[0] + d.apparent_temperature_min[0]) / 3),
      pop, code, rain: pop>=50 || (d.precipitation_sum?.[0]||0)>=1 || WX_RAIN.has(code) };
    wxSave(); wxApply();
  }catch{ wx.err = "Météo indisponible pour l'instant (pas de connexion ?). Tu peux la régler à la main."; }

}

function queue(ops){

  for(const o of ops) box[o.id] = {op:o.op, t:Date.now() + Math.random()};

async function flush(){
  if(store.mode!=="cloud" || flushing || !auth.user) return;
  const snap = LS.get(outboxKey(), {}) || {}; const ids = Object.keys(snap);
  store.pending = ids.length;
  if(!ids.length){ setSync("ok"); return; }
  if(!navigator.onLine){ setSync("offline"); return; }
  flushing = true; setSync("syncing");
  const done = list => { const box = LS.get(outboxKey(), {}) || {}; for(const id of list) if(box[id] && snap[id] && box[id].t===snap[id].t) delete box[id]; LS.set(outboxKey(), box); store.pending = Object.keys(box).length; };
  try{
    const sb = await supa(); const uid = auth.user.id;
    const puts = ids.filter(id => snap[id].op==="put").map(findDoc).filter(Boolean);
    let moved = false;
    for(const d of puts){
      if(!/^data:/.test(d.photo||"") || store.photosOK === false) continue;
      try{ const np = await uploadPhoto(sb, d); const cur = findDoc(d.id); if(cur && cur.photo === d.photo){ cur.photo = np; moved = true; } d.photo = np; }
      catch(e){ if(/bucket|not.?found|404/i.test(String(e?.message||e?.statusCode||e?.error||""))){ store.photosOK = false; } else throw e; }
    }
    if(moved){ localSave(); render(); }
    const orphan = ids.filter(id => snap[id].op==="put" && !findDoc(id));
    const dels = ids.filter(id => snap[id].op==="del");
    for(let k=0; k<puts.length; k+=20){
      const rows = puts.slice(k, k+20).map(d => { const {id, ...data} = d; return {user_id:uid, id, kind:d.kind, data, updated_at:new Date().toISOString()}; });
      const {error} = await sb.from(CLOUD.table).upsert(rows, {onConflict:"user_id,id"});
      if(error) throw error;
      done(rows.map(r=>r.id));
    }
    if(dels.length){ const {error} = await sb.from(CLOUD.table).delete().eq("user_id", uid).in("id", dels); if(error) throw error; done(dels); }
    done(orphan);
    emptyTrash(sb).catch(()=>{});
    setSync("ok");
  }catch(e){ setSync(isNetErr(e) ? "offline" : "error", e); }
  flushing = false;

async function cloudPull(){

  for(const r of rows) merged[r.id] = {...r.data, kind:r.kind, id:r.id};
  for(const [id, e] of Object.entries(box)){ const d = findDoc(id); if(e.op==="put" && d) merged[id] = d; else if(e.op==="del") delete merged[id]; }

}

function authErr(e){
  const m = String(e?.message||"") + " " + String(e?.code||"");

  if(/already registered|already exists|user_already_exists/i.test(m)) return "Cet identifiant est déjà pris. Choisis-en un autre, ou connecte-toi.";
  if(/signups? not allowed|signup_disabled/i.test(m)) return "Les inscriptions sont fermées sur ce projet Supabase (Authentication → Sign In / Providers → « Allow new users to sign up »).";
  if(/email_address_invalid|invalid.*email|email.*invalid/i.test(m)) return "Supabase refuse ce format d'identifiant. Voir le README (réglages e-mail du projet).";
  if(/email not confirmed|email_not_confirmed/i.test(m)) return "Compte pas encore confirmé : désactive « Confirm email » dans Supabase, puis réessaie.";
  if(/rate limit|over_request|over_email/i.test(m)) return "Trop de tentatives. Patiente une minute avant de réessayer.";
  if(/weak|password should|password is/i.test(m)) return "Mot de passe trop faible : allonge-le ou ajoute des chiffres.";
  if(isNetErr(e)) return "Pas de connexion à Internet. Réessaie, ou continue sans compte.";
  return "Connexion impossible (" + m.trim().slice(0,80) + ").";

function md(t){

    else { if(inList){ out += "</ul>"; inList = false; } if(l.trim()) para.push(l.replace(/^#+\s*/, "")); else flushP(); }
  }
  if(inList) out += "</ul>"; flushP(); return out;
}

function cropGeom(c){
  const m = Math.min(c.w, c.h), W = c.w/m*c.z*100, H = c.h/m*c.z*100;
  const mx = (W-100)/200, my = (H-100)/200;
  c.x = Math.max(-mx, Math.min(mx, c.x)); c.y = Math.max(-my, Math.min(my, c.y));
  const L = (100-W)/2 + c.x*100, T = (100-H)/2 + c.y*100;
  return {W, H, L, T, css:`width:${W}%;height:${H}%;left:${L}%;top:${T}%`};
}
function imgToCrop(im){ const cv = drawTo(im, 1200); return {src:toDataURL(cv), w:cv.width, h:cv.height, x:0, y:0, z:1}; }
async function exportCrop(c){
  if(c.remote) return c.src;
  const im = await loadImage(c.src), g = cropGeom(c), N = 640;
  const cv = document.createElement("canvas"); cv.width = cv.height = N;
  const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,N,N);
  ctx.drawImage(im, g.L/100*N, g.T/100*N, g.W/100*N, g.H/100*N);
  return cv.toDataURL("image/jpeg", .82);
}

function findProduct(node, depth=0){
  if(!node || typeof node!=="object" || depth>5) return null;

  const t = [].concat(node["@type"]||[]).join(" ");

  return findProduct(node["@graph"], depth+1) || (node.mainEntity ? findProduct(node.mainEntity, depth+1) : null);
}

/* ---------- Détourage : modèle d'IA U²-Net sur l'appareil (voir « IA gratuite sur l'appareil ») + retouche au doigt ----------

  out[j] = 116*y - 16; out[j+1] = 500*(x - y); out[j+2] = 200*(y - z);

    if(!inside(x, y)) continue;

      if(c) ex = `\nPar exemple : ${c.c.filter(x => x.id!=="__w").map(B).join(" + ")}.`;

}

/* Après une photo : reconnaissance du type si l'IA est activée et que Claude ne s'en charge pas */
async function laiTagItem(s){
  if(!lai.on || (store.ai && store.aiImages) || !s.item.photo) return;
  s.laiBusy = true; if(modal.state === s) modal.paint();
  try{
    const top = await laiClassify(photoSrc(s.item.photo));
    if(modal.state !== s) return;
    if(s.wish) readWishFields(s); else readEditFields(s);
    s.suggest = top; if(!s.catTouched) applyType(s.item, top[0]);
    s.aiNote = `Reconnu : ${top[0]}. Pas ça ? Touche une autre suggestion ou choisis le type.`;
  }catch{ s.aiNote = "Reconnaissance indisponible pour l'instant : choisis le type."; }
  s.laiBusy = false; if(modal.state === s) modal.paint();
}

/* ---------- Partage d'une tenue en image ---------- */
async function outfitImage(o){
  const its = outfitItems(o), W = 1080, H = 1350, P = 60, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d"); g.fillStyle = "#F6F6F4"; g.fillRect(0, 0, W, H);
  const by = c => its.find(i => i.category === c), side = by("couche") || by("accessoire");
  const mainW = side ? (W - 3*P)*0.62 : W - 2*P, sideX = P*2 + mainW, sideW = W - sideX - P, top = P, bottom = H - 190;
  const rows = by("robe") ? [[by("robe"), 2], [by("chaussures"), .8]] : [[by("haut"), 1], [by("bas"), 1], [by("chaussures"), .7]];
  const list = rows.filter(r => r[0]), tot = list.reduce((a, r) => a + r[1], 0) || 1, boxes = [];
  let y = top; for(const [i, w] of list){ const h = (bottom - top - (list.length-1)*20)*w/tot; boxes.push([i, P, y, mainW, h]); y += h + 20; }
  if(side){ const s2 = [by("couche"), by("accessoire")].filter(Boolean); const h = (bottom - top - 20)/2; s2.forEach((i, k) => boxes.push([i, sideX, top + k*(h + 20), sideW, h])); }
  for(const [i, x, yy, w, h] of boxes){
    g.fillStyle = "#FFFFFF"; g.beginPath(); g.roundRect(x, yy, w, h, 28); g.fill();
    let im = null;
    if(i.photo){ try{ im = await loadImageAny(photoSrc(i.photo)); }catch{} }
    if(!im){ try{ im = await loadImage("data:image/svg+xml;charset=utf-8," + encodeURIComponent(illo(i).replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" '))); }catch{} }
    if(im){ const k = Math.min((w-40)/im.naturalWidth, (h-40)/im.naturalHeight); const dw = im.naturalWidth*k, dh = im.naturalHeight*k; g.drawImage(im, x + (w-dw)/2, yy + (h-dh)/2, dw, dh); }
  }
  g.fillStyle = "#0B0B0F"; g.font = "700 54px Geist, system-ui, sans-serif"; g.fillText(o.name || "Ma tenue", P, H - 105);
  g.fillStyle = "#6B6B73"; g.font = "500 30px Geist, system-ui, sans-serif"; g.fillText([OCCASIONS[o.occasion]?.label, its.map(i => i.name).slice(0, 3).join(" · ")].filter(Boolean).join("  —  ").slice(0, 70), P, H - 60);
  g.fillStyle = "#4F46E5"; g.font = "800 34px Geist, system-ui, sans-serif"; g.textAlign = "right"; g.fillText("Cintre.", W - P, H - 105);
  return await new Promise((res, rej) => { try{ cv.toBlob(b => b ? res(b) : rej(new Error("toBlob")), "image/jpeg", .9); }catch(e){ rej(e); } });
}
async function shareOutfit(o){
  toast("Préparation de l'image…");
  let blob; try{ blob = await outfitImage(o); }catch{ toast("Impossible de créer l'image (une photo vient d'un site qui l'interdit)."); return; }
  const file = new File([blob], `${(o.name || "tenue").replace(/[^\w\- ]+/g, "").trim() || "tenue"}.jpg`, {type:"image/jpeg"});
  if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title:o.name || "Ma tenue"}); return; }catch(e){ if(e && e.name === "AbortError") return; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Image enregistrée.");
}

  const sleeping = items().map(i=>{ const w = ws[i.id]; const age = daysBetween(i.createdAt?.slice(0,10)||t, t); const idle = w ? daysBetween(w.last, t) : age; return {i, w, age, idle}; })
    .filter(x => (!x.w && x.age>=30) || x.idle>=90).sort((a,b)=>b.idle-a.idle);
  const head = `${brandMobile()}${backLink()}<div class="head"><div><h1>À <span class="s">revendre</span></h1><p>Les pièces qui dorment dans ton placard.</p></div></div>`;
  const stat = `<div class="stat"><div><b>${sleeping.length}</b><span>pièces à revoir</span></div><div><b>${items().filter(i=>!ws[i.id]).length}</b><span>jamais portées</span></div><div><b>${items().length?Math.round(Object.keys(ws).length/items().length*100):0} %</b><span>de la penderie portée</span></div></div>`;
  if(!sleeping.length) return head + stat + `<div class="panel empty"><p>Aucune pièce oubliée : rien n'est resté plus de 30 jours sans être porté depuis son ajout, ni plus de 90 jours depuis sa dernière sortie.</p></div>`;

const KEEP_FOCUS = ["q","chat-q","shop-q","wx-q"];
function render(){
  $("#tabs").innerHTML = navHTML(TABS, true); $("#side-tabs").innerHTML = navHTML(SIDE_TABS, false);
  const sa = $("#side-account"); if(sa) sa.innerHTML = sideAccount();
  const v = VIEWS[ui.tab] || viewAccueil;
  const act = document.activeElement, aid = act && KEEP_FOCUS.includes(act.id) ? act.id : null;
  let caret = null; try{ caret = aid ? act.selectionStart : null; }catch{}
  $("#view").innerHTML = v();
  if(aid){ const n = document.getElementById(aid); if(n){ n.focus({preventScroll:true}); try{ if(caret!=null) n.setSelectionRange(caret,caret); }catch{} } }
  if(modal.render) modal.paint();
}

/* ---------- Modales ---------- */
const modal = { render:null, state:{},
  open(fn, state={}){ const was = this.render; this.render = fn; this.state = state; if(was){ const sh = $("#modal .sheet"); if(sh) sh.scrollTop = 0; } this.paint(); },
  paint(){ if(this.painting) return; this.painting = true; try{ this._paint(); } finally { this.painting = false; } },
  _paint(){ const el=$("#modal"); if(!this.render){ el.innerHTML=""; return; }
    const keep = el.querySelector(".sheet")?.scrollTop || 0;
    const act = document.activeElement, aid = act && act.id && el.contains(act) && /^(INPUT|TEXTAREA)$/.test(act.tagName) ? act.id : null;
    let caret = null; try{ caret = aid ? act.selectionStart : null; }catch{}
    const open = el.querySelector(".sheet");
    if(open) open.innerHTML = this.render(this.state);
    else el.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${this.render(this.state)}</div></div>`;
    el.querySelector(".sheet").scrollTop = keep;
    if(aid){ const n = document.getElementById(aid); if(n){ n.focus({preventScroll:true}); try{ if(caret!=null) n.setSelectionRange(caret,caret); }catch{} } }
    if(this.render===mCut) cutDraw(); },
  close(){ this.render = null; this.state = {}; $("#modal").innerHTML = ""; }
};

function mLibrary(s){

  let res = CATALOG.filter(c => !q || q.split(/\s+/).every(w => norm(`${c.brand} ${c.name} ${c.type} ${(c.colors||[]).map(k=>COLOR_LABEL[k]).join(" ")} ${CATS[c.category].one}`).includes(w)));
  if(s.matches) res = s.matches.map(id=>CATALOG.find(c=>c.id===id)).filter(Boolean);
  const owned = new Set(items().map(i=>i.catalogId)); const wished = new Set([...DB.wish.values()].map(w=>w.catalogId));

/* ---------- Actions ---------- */
async function analysePhoto(file, s){
  s.busy = true; modal.paint();
  try{
    const im = await fileToImage(file);
    const blob = await toBlob(drawTo(im, 1024));
    const t = await store.ai.json(`Tu caractérises un vêtement pour une app de garde-robe. Regarde la photo et réponds uniquement avec un objet JSON de la forme ${TAG_SCHEMA}.`, {images:[blob], modelTier:"default"});
    const c = cleanTags(t||{});
    Object.assign(s.item, c, {photo:s.item.photo});
    s.aiNote = "Caractérisé par Claude. Vérifie et corrige si besoin.";
  }catch(e){ s.aiNote = aiError(e) + " Remplis les champs à la main."; }
  s.busy = false; if(modal.state===s) modal.paint();
}
async function onPhotoOne(file, src){
  const im = await fileToImage(file).catch(()=>null);
  if(!im){ toast("Image illisible."); return; }
  openCut(im, ({photo, colors}) => {
    const ai = store.ai && store.aiImages;
    const s = {item:newItem({photo, colors}), isNew:true, file, src, count: ui.burst || 0, aiNote: ai || lai.on ? "" : "Couleurs détectées sur la photo. Choisis le type, puis enregistre."};
    modal.open(mEdit, s);
    if(ai) analysePhoto(file, s); else laiTagItem(s);
  });
}
async function onBatch(file){
  const s = {busy:true, found:[]}; modal.open(mBatch, s);
  try{
    const im = await fileToImage(file);
    const blob = await toBlob(drawTo(im, 1568));
    const res = await store.ai.json(`La photo montre plusieurs vêtements (penderie ouverte, pièces étalées sur un lit ou au sol). Repère chaque pièce distincte et entièrement identifiable, 15 au maximum, en ignorant cintres, meubles et personnes. Pour chacune, donne une boîte englobante "box": [x0, y0, x1, y1] en fractions de 0 à 1 de la largeur et de la hauteur de l'image (origine en haut à gauche), un peu large plutôt que trop serrée. Réponds uniquement avec du JSON : {"items": [ { "box": [...], ...champs } ]} où les champs suivent ce format : ${TAG_SCHEMA}.`, {images:[blob], modelTier:"complex"});
    const list = Array.isArray(res?.items) ? res.items : [];
    s.found = list.map(r => {
      let b = (r.box||[]).map(Number); if(b.length!==4 || b.some(isNaN)) b = [0,0,1,1];
      if(b.some(v=>v>1.5)) b = [b[0]/im.naturalWidth, b[1]/im.naturalHeight, b[2]/im.naturalWidth, b[3]/im.naturalHeight];
      const pad = .03; const box = [Math.max(0,Math.min(b[0],b[2])-pad), Math.max(0,Math.min(b[1],b[3])-pad), Math.min(1,Math.max(b[0],b[2])+pad), Math.min(1,Math.max(b[1],b[3])+pad)];
      if(box[2]-box[0]<.03 || box[3]-box[1]<.03) return null;
      return {...newItem(cleanTags(r)), photo: toDataURL(drawTo(im, 560, box)), keep:true};
    }).filter(Boolean);
    if(!s.found.length) s.err = "Aucune pièce reconnue. Essaie une photo plus nette, vêtements bien séparés sur un fond uni.";
  }catch(e){ s.err = aiError(e); }
  s.busy = false; if(modal.state===s) modal.paint();
}
async function onLibPhoto(file, s){
  s.busy = true; modal.paint();
  try{
    const im = await fileToImage(file); const blob = await toBlob(drawTo(im, 1024));
    const cat = CATALOG.map(c=>`${c.id}: ${c.brand} ${c.name} (${c.type}, ${c.colors.join("/")})`).join("\n");
    const r = await store.ai.json(`Voici un catalogue de vêtements :\n${cat}\n\nQuels articles ressemblent le plus au vêtement principal de la photo ? Réponds uniquement avec un tableau JSON d'au plus 3 identifiants du catalogue, du plus proche au moins proche, ex. ["c4","c1"].`, {images:[blob], modelTier:"default"});
    s.matches = (Array.isArray(r)?r:[]).filter(id=>CATALOG.some(c=>c.id===id));

  }catch(e){ toast(aiError(e)); }
  s.busy = false; if(modal.state===s) modal.paint();
}

async function logWear(itemIds, outfitId, date=today()){

/* Garde-robe d'exemple (ajoutée seulement sur demande, marquée « Exemple ») */
async function loadDemo(){
  const pick = ["c16","c17","c18","c20","c22","c8","c9","c10","c12","c1","c2","c6","c25","c26","c28","c34"];
  const now = Date.now(); const ids = {};
  const docs = pick.map((cid,k)=>{ const c = CATALOG.find(x=>x.id===cid); const id = uid("item"); ids[cid]=id;
    return {...newItem(), ...c, id, kind:"item", catalogId:cid, demo:true, createdAt:new Date(now - (k===14?70:k===13?45:20+k)*864e5).toISOString()}; });
  docs.push({...newItem(), id:uid("item"), name:"Chemise en lin rouille", category:"haut", type:"Chemise", colors:["orange"], seasons:["été","printemps"], styles:["casual"], material:"Lin", demo:true, createdAt:new Date(now-120*864e5).toISOString()});
  const outs = [
    {name:"Lundi au bureau", it:["c18","c10","c6","c26"], occasion:"travail", seasons:["printemps","automne"], fav:true},
    {name:"Cours tranquille", it:["c22","c8","c1"], occasion:"cours", seasons:["automne","printemps"], fav:true},
    {name:"Soirée en noir", it:["c17","c9","c2"], occasion:"soiree", seasons:["automne","hiver","printemps"]},
    {name:"Week-end cargo", it:["c16","c12","c1","c25"], occasion:"weekend", seasons:["printemps","automne"]}
  ].map((o,k)=>({kind:"outfit", id:uid("outfit"), name:o.name, itemIds:o.it.map(c=>ids[c]), occasion:o.occasion, seasons:o.seasons, fav:!!o.fav, demo:true, createdAt:new Date(now-k*864e5).toISOString()}));
  const wears = [];
  const plan = [[1,1],[2,0],[3,2],[5,1],[6,3],[8,0],[9,1],[12,2],[13,0],[15,1],[16,3]];
  for(const [d,o] of plan) wears.push({kind:"wear", id:uid("wear"), date:iso(new Date(now-d*864e5)), outfitId:outs[o].id, itemIds:outs[o].itemIds, demo:true, createdAt:new Date().toISOString()});
  const wish = [{...CATALOG.find(c=>c.id==="c27")},{...CATALOG.find(c=>c.id==="c23")}].map(c=>({...c, kind:"wish", id:uid("wish"), catalogId:c.id, demo:true, createdAt:new Date().toISOString()}));
  const all = [...docs, ...outs, ...wears, ...wish];
  ui.jour.picks = null; await saveMany(all);
  toast("Garde-robe d'exemple chargée.");
}
async function clearDemo(){
  const ids = []; for(const m of Object.values(DB)) for(const [id,d] of m) if(d.demo) ids.push(id);
  ui.jour.picks = null; await removeMany(ids);
  toast("Exemples retirés.");
}

document.addEventListener("change", e => {
  const t = e.target, s = modal.state;
  if(t.type==="file" && t.files && t.files[0]){
    const f = t.files[0];
    if(t.id.startsWith("file-one")) onPhotoOne(f, t.id.endsWith("cam") ? "cam" : "gal");
    else if(t.id.startsWith("file-rafale")) onPhotoOne(f, t.id.endsWith("cam") ? "cam" : "gal");
    else if(t.id.startsWith("file-batch")) (store.ai && store.aiImages ? onBatch(f) : onBatchManual(f));
    else if(t.id==="file-bman") onBatchManual(f);
    else if(t.id==="file-lib") onLibPhoto(f, s);
    else if(t.id==="import-file") importBackup(f);
    else if(t.id.startsWith("file-wish")) onWishPhoto(f, s);
    t.value = "";
  }
  else if(t.id==="set-key"){ saveKey(t.value.trim()); toast(t.value.trim()?"Clé enregistrée.":"Clé retirée."); }
  else if(t.id==="f-color"){ ui.color = t.value; render(); }
  else if(t.id==="f-season"){ ui.season = t.value; render(); }
  else if(t.id==="f-sort"){ ui.sort = t.value; render(); }
  else if(t.id==="j-rain"){ wx.manual = !!wx.data; ui.jour.rain = t.checked; ui.jour.picks = null; ui.jour.idx=0; render(); }
  else if(t.id==="wi-cat"){ readWishFields(s); s.item.type = CATS[s.item.category].types[0]; modal.paint(); }
  else if(t.id==="o-withwish"){ s.name = $("#o-name")?.value; s.withWish = t.checked; if(!t.checked) for(const k of Object.keys(s.sel)) if(DB.wish.has(s.sel[k])) s.sel[k] = null; modal.paint(); }
  else if(t.id==="ed-name" && s.item && !s.catTouched && !(store.ai && store.aiImages)){ readEditFields(s); const g = guessFromText(s.item.name); if(g.type){ applyType(s.item, g.type); } if(g.colors && !(s.item.colors||[]).length) s.item.colors = g.colors; if(g.category || g.colors) modal.paint(); }
  else if(t.id==="ed-cat"){ s.catTouched = true; readEditFields(s); s.item.type = CATS[s.item.category].types[0]; modal.paint(); }
  else if(t.dataset.act==="b-tog"){ s.found[+t.dataset.v].keep = t.checked; modal.paint(); }
  else if(t.dataset.act==="b-cat"){ const f = s.found[+t.dataset.v]; f.category = t.value; f.type = CATS[t.value].types[0]; modal.paint(); }
  else if(t.dataset.act==="b-type"){ s.found[+t.dataset.v].type = t.value; }
});
document.addEventListener("input", e => {
  const t = e.target;
  if(t.id==="q"){ ui.q = t.value; render(); }
  else if(t.id==="shop-q"){ ui.shop.q = t.value; }
  else if(t.id==="chat-q"){ chat.draft = t.value; t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; }
  else if(t.id==="wx-q"){ wx.q = t.value; }
  else if(t.id==="cut-brush"){ modal.state.brush = +t.value; }
  else if(t.id==="wi-zoom"){ const c = modal.state.crop; if(c){ c.z = +t.value/100; const img = $("#crop-img"); if(img) img.style.cssText = cropGeom(c).css; const o = $("#wi-zoom-v"); if(o) o.textContent = t.value + " %"; } }
  else if(t.id==="lib-q"){ const s = modal.state; s.q = t.value; s.matches = null; const pos = t.selectionStart; modal.paint(); const n=$("#lib-q"); n.focus(); n.setSelectionRange(pos,pos); }
});
document.addEventListener("submit", e => {
  const f = e.target.dataset.form;
  if(f==="gate"){ e.preventDefault(); gateSubmit(); }
  else if(f==="chat"){ e.preventDefault(); const q = $("#chat-q")?.value || ""; askStylist(q); }
});
document.addEventListener("keydown", e => {
  if(e.target.id==="chat-q" && e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); askStylist(e.target.value); }
});
document.addEventListener("submit", async e => {
  if(e.target.dataset.form !== "shop") return;
  e.preventDefault();
  const S = ui.shop; const q = S.q.trim(); if(!q){ toast("Tape un vêtement à chercher."); return; }
  S.done = q; S.results = null; S.err = ""; document.activeElement?.blur();
  if(!(STANDALONE && store.web)){ render(); return; }
  S.busy = true; render();
  try{ const res = await liveShopSearch(q); if(S.done===q) S.results = res; }
  catch(err){ if(S.done===q) S.err = aiError(err); }
  if(S.done===q){ S.busy = false; render(); }
});
async function importBackup(file){
  try{
    const data = JSON.parse(await file.text());
    const docs = data && data.docs; if(!docs || typeof docs !== "object") throw 0;
    const list = Object.entries(docs).filter(([,d]) => d && KIND_OF[d.kind]).map(([id,d]) => ({...d, id}));
    ui.jour.picks = null; modal.close(); await saveMany(list); toast(`${list.length} éléments importés.`);
  }catch{ toast("Ce fichier n'est pas une sauvegarde Cintre."); }
}
document.addEventListener("keydown", e => { if(e.key==="Escape" && modal.render) modal.close(); });
document.addEventListener("toggle", e => { const d = e.target; if(d && d.dataset && d.dataset.k){ const st = d.closest("#modal") ? modal.state : prefs; if(st) st[d.dataset.k] = d.open; } }, true);
document.addEventListener("click", e => { /* enregistrement du lot */
  const el = e.target.closest('[data-act="b-save"]'); if(!el) return;
  const s = modal.state; const keep = s.found.filter(f=>f.keep);
  modal.close(); ui.jour.picks = null;
  const docs = keep.map(f => { const {keep:_, manual, ...doc} = f; if(manual){ if(!doc.colors.length) doc.colors = ["gris"]; doc.name = `${doc.type} ${COLOR_LABEL[doc.colors[0]].toLowerCase()}`; } return doc; });
  saveMany(docs).then(() => toast(`${docs.length} pièce(s) ajoutée(s). Touche une pièce pour compléter sa fiche.`));
});
window.addEventListener("hashchange", ()=>{ const h = location.hash.slice(1); if(VIEWS[h] && h!==ui.tab){ ui.tab = h; render(); } });
addEventListener("online", () => { if(store.mode==="cloud") flushSoon(0); });
document.addEventListener("visibilitychange", () => { if(!document.hidden && store.mode==="cloud" && Date.now() - (store.pulledAt||0) > 60e3) syncNow(); });

(function boot(){
  const h = location.hash.slice(1); if(VIEWS[h]) ui.tab = h;
  ui.jour.occ = defaultOcc();
  wxApply(); render(); initStore();
  if(wx.loc && wxStale()) wxFetch();
})();
</script>
